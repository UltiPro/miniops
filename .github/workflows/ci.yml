name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  lowest:
    name: Test (lowest dependency versions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # The lowest versions that pyproject.toml allows, so that its lower bounds stay true.
      # Without the project, uv leaves uv.lock alone. pytest and pytest-cov get the bounds of
      # the dev group, or they would be their oldest releases.
      - run: >-
          uv run --no-project --isolated --resolution lowest-direct
          --with-editable ".[sklearn]" --with "pytest>=9.2" --with "pytest-cov>=7.1"
          pytest

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      # Install the wheel the way a user gets it from PyPI: no lock file, newest dependencies.
      # A project and a model made with it outside the repository check the packaged templates,
      # and model.py, which imports the flavor, checks the model environment.
      - name: Use the built package
        run: |
          miniops() { uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl miniops "$@"; }
          miniops version
          mkdir "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          miniops init
          miniops new churn --flavor sklearn --task binary_classification
          cat models/churn/.python-version
          models/churn/.venv/bin/python models/churn/model.py

  all-checks:
    name: All checks
    # The branch ruleset requires only this job, so it stays valid when the test matrix changes.
    if: always()
    needs: [lint, test, lowest, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
