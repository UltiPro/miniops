name: Feature request
description: Suggest an idea or a use case for miniOPs
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could miniOPs help? Example commands or config are very welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you have tried.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is about model lifecycle (training, evaluation, registry, serving, monitoring), not data engineering.
          required: true
