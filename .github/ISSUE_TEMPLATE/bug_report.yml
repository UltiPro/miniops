name: Bug report
description: Something does not work as expected
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands you ran
      description: The exact miniops commands that reproduce the problem, one per line.
      render: shell
    validations:
      required: true
  - type: textarea
    id: model_files
    attributes:
      label: Minimal model.toml or model.py (optional)
      description: If the bug depends on your model, paste a minimal version. Use ```toml or ```python code blocks.
  - type: textarea
    id: version
    attributes:
      label: Output of `miniops version`
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - local
        - docker
        - gcp
        - not relevant
    validations:
      required: true
  - type: dropdown
    id: flavor
    attributes:
      label: Framework (flavor)
      options:
        - scikit-learn
        - LightGBM
        - PyTorch
        - not relevant
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: text
